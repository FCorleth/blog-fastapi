{% extends "layout.html" %}{% block content %}
<article class="content-section post-card post-detail">
  <div class="post-layout">
    <img
      class="article-img"
      src="{{ url_for('static', path='profile_pics/default.jpg') }}"
      alt="{{ post.author }}'s profile picture"
      width="64"
      height="64"
      loading="lazy"
    />
    <div class="post-body">
      <div class="article-metadata">
        <a href="#">{{ post.author }}</a
        ><small class="muted-text">{{ post.date_posted }}</small>
      </div>
      <h2 class="article-title">{{ post.title }}</h2>
      <p class="article-content">{{ post.content }}</p>
      <div class="post-actions">
        <a class="button button-secondary" href="#">Edit Post</a
        ><button
          type="button"
          class="button button-danger"
          data-modal-open="deleteModal"
        >
          Delete Post
        </button>
      </div>
    </div>
  </div>
</article>
<div
  class="modal"
  id="deleteModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="deleteModalLabel"
  hidden
>
  <div class="modal-backdrop" data-modal-close="deleteModal"></div>
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="deleteModalLabel">Delete Post?</h3>
      <button
        type="button"
        class="modal-close"
        data-modal-close="deleteModal"
        aria-label="Close"
      >
        &times;
      </button>
    </div>
    <form action="#">
      <div class="modal-body">
        Are you sure you want to delete this post? This action cannot be undone.
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="button button-secondary"
          data-modal-close="deleteModal"
        >
          Cancel</button
        ><button type="submit" class="button button-danger">Delete</button>
      </div>
    </form>
  </div>
</div>
<script>
  document.querySelectorAll("[data-modal-open]").forEach((b) =>
    b.addEventListener("click", () => {
      document.getElementById(b.dataset.modalOpen).hidden = false;
      document.body.classList.add("modal-open");
    }),
  );
  document.querySelectorAll("[data-modal-close]").forEach((b) =>
    b.addEventListener("click", () => {
      document.getElementById(b.dataset.modalClose).hidden = true;
      document.body.classList.remove("modal-open");
    }),
  );
</script>
{% endblock content %}
